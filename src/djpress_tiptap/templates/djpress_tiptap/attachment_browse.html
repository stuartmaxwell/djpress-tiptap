<div class="djpress-tiptap-browser-head">
  <h2>Media library</h2>
  <button type="button" data-close aria-label="Close">&times;</button>
</div>
{% if page.object_list %}
  <div class="djpress-tiptap-browser-grid">
    {% for attachment in page %}
      <button
        type="button"
        data-image-url="{{ attachment.file.url }}"
        data-image-alt="{{ attachment.alt_text }}"
        title="{{ attachment.original_filename }}"
      >
        <img src="{{ attachment.file.url }}" alt="{{ attachment.alt_text }}" loading="lazy">
      </button>
    {% endfor %}
  </div>
{% else %}
  <p class="djpress-tiptap-browser-empty">No images yet. Upload one with the toolbar button.</p>
{% endif %}
<div class="djpress-tiptap-browser-nav">
  {% if page.has_previous %}
    <button type="button" data-fetch="?page={{ page.previous_page_number }}">&larr; Newer</button>
  {% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <button type="button" data-fetch="?page={{ page.next_page_number }}">Older &rarr;</button>
  {% endif %}
</div>
