line-length = 120
target-version = "py314"

[lint]
select = ["ALL"]
ignore = [
  "G004",   # Logging statement uses f-string
  "D203",   # 1 blank line required before class docstring
  "D213",   # multi-line-summary-second-line
  "TD003",  # Missing issue link on the line following this TODO
  "FIX002", # Line contains TODO, consider resolving the issue
  "TD002",  # Missing author in TODO
  "S308",   # suspicious-mark-safe-usage
  "PGH003", # Use specific rule codes when ignoring type issues
  "COM812", # Trailing comma missing
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  # "ANN002",  # missing-type-args
  # "ANN003",  # missing-type-kwargs
  "CPY001", # Missing copyright notice at top of file

]

[lint.per-file-ignores]
"example/*" = ["ALL"]
"**/migrations/*" = ["ALL"]
"settings_testing.py" = ["ALL"]
"test_auth.py" = ["ALL"]

[lint.extend-per-file-ignores]
"test*" = ["ANN001", "ANN002", "ANN202", "ANN003", "ANN201", "ANN206", "D100", "D101", "D102", "D103", "S101", "S106", "PLC0415", "PLR2004", "T201", "PT011", "SLF001"]
"src/djpress_tiptap/widgets.py" = ["ANN001", "ANN201", "ANN204", "ARG002", "D106"]
"src/djpress_tiptap/views.py" = ["ANN001", "ANN201", "D102"]

[lint.pydocstyle]
convention = "google" # Accepts: "google", "numpy", or "pep257".
