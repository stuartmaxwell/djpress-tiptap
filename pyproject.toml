[project]
name = "djpress-tiptap"
version = "0.4.0"
description = "Rich text editor for DJ Press based on Tiptap."
authors = [
    {name = "Stuart Maxwell", email = "stuart@amanzi.nz"},
]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "djpress>=0.30.0",
    "pillow~=12.3",
    "puremagic~=2.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "playwright~=1.61",
    "pytest-django~=4.12",
    "pytest-playwright>=0.8.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
pythonpath = ". example"
DJANGO_SETTINGS_MODULE = "config.settings_testing"
python_files = "tests.py test_*.py *_tests.py"
markers = [
    "e2e: browser tests driving the live server (deselect with -m 'not e2e')",
]

[tool.djangofmt]
line-length = 240
indent-width = 2
profile = "django"
html-void-self-closing = "never"
preserve-unquoted-attrs = false
